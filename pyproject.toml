[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scheduler-api-fastapi"
version = "0.1.0"
description = "Extensible open source FastAPI scheduling backend starter"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "cryptography>=49,<50",
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "uvicorn[standard]>=0.30,<1",
  "workos>=9,<10",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]
providers = ["composio>=0.21,<1", "resend>=2.34,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
